<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Islamic From iqra quran academy</title>

<style>

/* =========================
   LIGHT MODE
========================= */

:root {
  --bg: #f5f1e8;
  --card: #ffffff;
  --text: #12352b;
  --primary: #063d2d;
  --secondary: #e6c65c;
  --translation: #555555;
  --border: #dddddd;
}

/* =========================
   DARK MODE
========================= */

body.dark {
  --bg: #101817;
  --card: #192321;
  --text: #f1f1f1;
  --primary: #0b6046;
  --secondary: #e6c65c;
  --translation: #cccccc;
  --border: #34403d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* =========================
   HEADER
========================= */

header {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 25px;
  position: relative;
}

header h1 {
  margin: 0;
  color: var(--secondary);
}

header p {
  margin: 8px 0 0;
}

/* DARK MODE BUTTON */

.theme-btn {
  position: absolute;
  right: 20px;
  top: 20px;
  border: none;
  background: var(--secondary);
  color: #063d2d;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 16px;
}

/* =========================
   HERO
========================= */

.hero {
  background: linear-gradient(
    135deg,
    #063d2d,
    #0b6046
  );
  color: white;
  text-align: center;
  padding: 45px 20px;
}

.hero h2 {
  font-size: 32px;
  margin-bottom: 10px;
}

.search-box {
  max-width: 650px;
  margin: 25px auto;
}

.search-box input {
  width: 100%;
  padding: 16px 20px;
  border-radius: 30px;
  border: none;
  font-size: 17px;
}

/* =========================
   MAIN CONTENT
========================= */

.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.title {
  text-align: center;
  margin-bottom: 25px;
  color: var(--primary);
}

/* =========================
   SURAH LIST
========================= */

.surah-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(270px, 1fr));
  gap: 15px;
}

.surah-card {
  background: var(--card);
  border-radius: 15px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 15px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: 0.3s;
}

.surah-card:hover {
  transform: translateY(-4px);
}

.number {
  width: 45px;
  height: 45px;
  min-width: 45px;
  background: var(--primary);
  color: var(--secondary);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}

.info {
  flex: 1;
}

.info h3 {
  margin: 0;
}

.info p {
  margin: 5px 0 0;
  opacity: 0.7;
}

.arabic-name {
  font-size: 25px;
  direction: rtl;
}

/* =========================
   QURAN READER
========================= */

#reader {
  display: none;
  max-width: 900px;
  margin: 30px auto;
  padding: 25px;
}

.reader-header {
  text-align: center;
  margin-bottom: 25px;
}

.reader-header h2 {
  color: var(--primary);
}

/* BACK BUTTON */

.back-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
}

/* =========================
   FONT CONTROLS
========================= */

.font-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin: 25px 0;
}

.font-controls button {
  background: var(--primary);
  color: var(--secondary);
  border: none;
  width: 50px;
  height: 45px;
  border-radius: 10px;
  font-size: 24px;
  cursor: pointer;
}

.font-controls span {
  font-weight: bold;
}

/* =========================
   AYAH
========================= */

.ayah {
  background: var(--card);
  margin-bottom: 15px;
  padding: 25px;
  border-radius: 15px;
  border-right: 5px solid var(--secondary);
}

.arabic {
  font-size: 30px;
  line-height: 2;
  text-align: right;
  direction: rtl;
  transition: font-size 0.2s;
}

.translation {
  margin-top: 15px;
  color: var(--translation);
  line-height: 1.7;
}

.loading {
  text-align: center;
  font-size: 20px;
  padding: 40px;
}

/* =========================
   FOOTER
========================= */

footer {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 50px;
}

footer h2 {
  color: var(--secondary);
}

/* =========================
   MOBILE
========================= */

@media(max-width: 600px) {

  header {
    padding-top: 65px;
  }

  .theme-btn {
    top: 15px;
    right: 15px;
  }

  .hero h2 {
    font-size: 25px;
  }

  .surah-grid {
    grid-template-columns: 1fr;
  }

  .font-controls {
    gap: 10px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <button class="theme-btn" onclick="toggleDarkMode()" id="themeButton">
    🌙 Dark
  </button>

  <h1>☪ </h1>

  <p>Read • Learn • Understand The Holy Quran</p>

</header>


<!-- HERO -->

<section class="hero">

  <h2>📖 Read The Holy Quran</h2>

  <p>Search any Surah by name or number</p>

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="Search Surah... Example: Yaseen, Fatiha, 36"
      onkeyup="searchSurah()"
    >

  </div>

</section>


<!-- HOME -->

<div class="container" id="home">

  <h2 class="title">📖 All 114 Surahs</h2>

  <div class="surah-grid" id="surahList"></div>

</div>


<!-- QURAN READER -->

<div id="reader">

  <button class="back-btn" onclick="goBack()">
    ← Back to Surahs
  </button>


  <div class="reader-header">

    <h2 id="surahTitle"></h2>

  </div>


  <!-- FONT SIZE BUTTONS -->

  <div class="font-controls">

    <button onclick="decreaseFont()">A−</button>

    <span id="fontSizeText">
      Ayat Size
    </span>

    <button onclick="increaseFont()">A+</button>

  </div>


  <!-- AYAT -->

  <div id="ayahs"></div>

</div>


<!-- FOOTER -->

<footer>

  <h2>☪ Islamic From iqra quran academy</h2>

  <p>Learn Quran Online With Tajweed & Translation</p>

  <p>© Islamic From iqra quran academy</p>

</footer>


<script>

/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

  document.body.classList.toggle("dark");

  let button = document.getElementById("themeButton");

  if (document.body.classList.contains("dark")) {

    button.innerHTML = "☀️ Light";

    localStorage.setItem("theme", "dark");

  } else {

    button.innerHTML = "🌙 Dark";

    localStorage.setItem("theme", "light");

  }

}


/* LOAD SAVED THEME */

if (localStorage.getItem("theme") === "dark") {

  document.body.classList.add("dark");

  document.getElementById("themeButton").innerHTML =
    "☀️ Light";

}


/* =========================
   FONT SIZE SYSTEM
========================= */

let arabicFontSize = 30;


/* INCREASE FONT */

function increaseFont() {

  if (arabicFontSize < 60) {

    arabicFontSize += 2;

    updateFontSize();

  }

}


/* DECREASE FONT */

function decreaseFont() {

  if (arabicFontSize > 20) {

    arabicFontSize -= 2;

    updateFontSize();

  }

}


/* UPDATE FONT */

function updateFontSize() {

  let arabicTexts =
    document.querySelectorAll(".arabic");

  arabicTexts.forEach(function(ayah) {

    ayah.style.fontSize =
      arabicFontSize + "px";

  });

  document.getElementById("fontSizeText").innerHTML =
    "Ayat: " + arabicFontSize + "px";

  localStorage.setItem(
    "arabicFontSize",
    arabicFontSize
  );

}


/* LOAD SAVED FONT SIZE */

let savedFontSize =
  localStorage.getItem("arabicFontSize");

if (savedFontSize) {

  arabicFontSize =
    parseInt(savedFontSize);

}


/* =========================
   GET SURAHS
========================= */

let surahs = [];


fetch("https://api.alquran.cloud/v1/surah")

.then(response => response.json())

.then(data => {

  surahs = data.data;

  displaySurahs(surahs);

})

.catch(() => {

  document.getElementById("surahList").innerHTML =
    "<p>Internet connection required to load Quran.</p>";

});


/* =========================
   DISPLAY SURAHS
========================= */

function displaySurahs(list) {

  let html = "";

  list.forEach(surah => {

    html += `

    <div
      class="surah-card"
      onclick="openSurah(${surah.number})"
    >

      <div class="number">

        ${surah.number}

      </div>


      <div class="info">

        <h3>
          ${surah.englishName}
        </h3>

        <p>
          ${surah.englishNameTranslation}
          •
          ${surah.numberOfAyahs} Ayahs
        </p>

      </div>


      <div class="arabic-name">

        ${surah.name}

      </div>

    </div>

    `;

  });

  document.getElementById("surahList").innerHTML = html;

}


/* =========================
   SEARCH
========================= */

function searchSurah() {

  let search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  let filtered = surahs.filter(surah =>

    surah.englishName
      .toLowerCase()
      .includes(search)

    ||

    surah.name.includes(search)

    ||

    surah.number
      .toString() === search

  );


  displaySurahs(filtered);

}


/* =========================
   OPEN SURAH
========================= */

function openSurah(number) {

  document.getElementById("home").style.display =
    "none";

  document.querySelector(".hero").style.display =
    "none";

  document.getElementById("reader").style.display =
    "block";


  document.getElementById("ayahs").innerHTML =
    "<div class='loading'>📖 Loading Quran...</div>";


  fetch(
    "https://api.alquran.cloud/v1/surah/" +
    number +
    "/editions/quran-uthmani,en.asad"
  )

  .then(response => response.json())

  .then(data => {

    let arabicSurah = data.data[0];

    let translationSurah = data.data[1];


    document.getElementById("surahTitle").innerHTML =

      arabicSurah.number +
      ". " +
      arabicSurah.englishName +
      " — " +
      arabicSurah.name;


    let html = "";


    for (
      let i = 0;
      i < arabicSurah.ayahs.length;
      i++
    ) {


      html += `

      <div class="ayah">


        <div
          class="arabic"
          style="font-size:${arabicFontSize}px"
        >

          ${arabicSurah.ayahs[i].text}

          <span
            style="
              color:#b38b00;
              font-size:18px;
            "
          >
            (${arabicSurah.ayahs[i].numberInSurah})
          </span>

        </div>


        <div class="translation">

          <b>Translation:</b>

          <br>

          ${translationSurah.ayahs[i].text}

        </div>


      </div>

      `;

    }


    document.getElementById("ayahs").innerHTML =
      html;


    document.getElementById("fontSizeText").innerHTML =
      "Ayat: " +
      arabicFontSize +
      "px";


  })

  .catch(() => {

    document.getElementById("ayahs").innerHTML =

      "<div class='loading'>❌ Quran could not be loaded. Please check your internet connection.</div>";

  });

}


/* =========================
   BACK
========================= */

function goBack() {

  document.getElementById("home").style.display =
    "block";

  document.querySelector(".hero").style.display =
    "block";

  document.getElementById("reader").style.display =
    "none";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>

</body>
</html>
